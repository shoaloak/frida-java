name: Build Frida

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-frida-linux-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      artifact-path: ${{ steps.upload-frida.outputs.artifact-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux so
        run: ./frida-java-core/scripts/build-frida-linux.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-linux-aarch64
          path: ./frida-java-core/frida-devkit/libfrida-core-arm64.so

  build-frida-linux-x64:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ steps.upload-frida.outputs.artifact-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux so
        run: ./frida-java-core/scripts/build-frida-linux.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-linux-x86_64
          path: ./frida-java-core/frida-devkit/libfrida-core-x86_64.so

  build-frida-macos:
    runs-on: macos-latest
    outputs:
      artifact-path: ${{ steps.upload-frida.outputs.artifact-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build universal macOS dylib
        run: ./frida-java-core/scripts/build-frida-macos.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-macos-universal
          path: "./frida-java-core/frida-devkit/libfrida-core.dylib"

  build-frida-windows-arm64:
    runs-on: windows-11-arm
    outputs:
      artifact-path: ${{ steps.upload-frida.outputs.artifact-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build windows dll
        shell: powershell
        run: ./frida-java-core/scripts/build-frida-windows.ps1

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-windows-aarch64
          path: ./frida-java-core/frida-devkit/libfrida-core-arm64.dll

  build-frida-windows-x64:
    runs-on: windows-latest
    outputs:
      artifact-path: ${{ steps.upload-frida.outputs.artifact-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build windows dll
        shell: powershell
        run: ./frida-java-core/scripts/build-frida-windows.ps1

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-windows-x86_64
          path: ./frida-java-core/frida-devkit/libfrida-core-x86_64.dll

  build-frida-java:
    needs: [build-frida-linux-arm64, build-frida-linux-x64, build-frida-macos, build-frida-windows-arm64, build-frida-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-linux-aarch64
          path: ./frida-java-core/native/

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-linux-x86_64
          path: ./frida-java-core/native/

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-macos-universal
          path: ./frida-java-core/native/

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-windows-aarch64
          path: ./frida-java-core/native/

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-windows-x86_64
          path: ./frida-java-core/native/

      - name: Verify library artifacts
        run: ls -l ./frida-java-core/native/

      - name: Build bindings with Maven and package classifier JARs
        run: mvn --batch-mode --no-transfer-progress --projects frida-java-core --also-make clean package

      - name: Verify packaged artefacts
        run: ls -l ./frida-java-core/target/frida-java-*.jar

      - name: Verify base JAR excludes native binaries
        run: |
          BASE_JAR=$(find ./frida-java-core/target -maxdepth 1 -type f -name "frida-java-*.jar" \
            ! -name "*-linux-*.jar" \
            ! -name "*-windows-*.jar" \
            ! -name "*-macos-*.jar" | head -n 1)
          if [ -z "$BASE_JAR" ]; then
            echo "Base JAR not found"
            exit 1
          fi
          if jar tf "$BASE_JAR" | grep -E '^native/' >/dev/null; then
            echo "Base JAR still contains native binaries"
            exit 1
          fi
          ls -lh "$BASE_JAR"

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: ./frida-java-core/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload maven-release base JAR
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-frida-java-base
          path: |
            ./frida-java-core/target/frida-java-*.jar
            !./frida-java-core/target/frida-java-*-linux-*.jar
            !./frida-java-core/target/frida-java-*-windows-*.jar
            !./frida-java-core/target/frida-java-*-macos-*.jar

      - name: Upload maven-release Linux x86_64 classifier JAR
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-frida-java-classifier-linux-x86_64
          path: ./frida-java-core/target/frida-java-*-linux-x86_64.jar

      - name: Upload maven-release Linux aarch64 classifier JAR
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-frida-java-classifier-linux-aarch64
          path: ./frida-java-core/target/frida-java-*-linux-aarch64.jar

      - name: Upload maven-release Windows x86_64 classifier JAR
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-frida-java-classifier-windows-x86_64
          path: ./frida-java-core/target/frida-java-*-windows-x86_64.jar

      - name: Upload maven-release Windows aarch64 classifier JAR
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-frida-java-classifier-windows-aarch64
          path: ./frida-java-core/target/frida-java-*-windows-aarch64.jar

      - name: Upload maven-release macOS universal classifier JAR
        uses: actions/upload-artifact@v7
        with:
          name: maven-release-frida-java-classifier-macos-universal
          path: ./frida-java-core/target/frida-java-*-macos-universal.jar
