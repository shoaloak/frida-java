name: Release to Maven Central

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frida-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux so
        run: ./frida-java-core/scripts/build-frida-linux.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-linux-aarch64
          path: ./frida-java-core/frida-devkit/libfrida-core-arm64.so

  build-frida-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux so
        run: ./frida-java-core/scripts/build-frida-linux.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-linux-x86_64
          path: ./frida-java-core/frida-devkit/libfrida-core-x86_64.so

  build-frida-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build universal macOS dylib
        run: ./frida-java-core/scripts/build-frida-macos.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-macos-universal
          path: ./frida-java-core/frida-devkit/libfrida-core.dylib

  build-frida-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build windows dll
        shell: powershell
        run: ./frida-java-core/scripts/build-frida-windows.ps1

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-windows-aarch64
          path: ./frida-java-core/frida-devkit/libfrida-core-arm64.dll

  build-frida-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build windows dll
        shell: powershell
        run: ./frida-java-core/scripts/build-frida-windows.ps1

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-windows-x86_64
          path: ./frida-java-core/frida-devkit/libfrida-core-x86_64.dll

  publish:
    needs:
      - build-frida-linux-arm64
      - build-frida-linux-x64
      - build-frida-macos
      - build-frida-windows-arm64
      - build-frida-windows-x64
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK with Maven Central and GPG
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Use stCarolas/setup-maven to set up Maven 3.9.x,
      # because central-publishing-maven-plugin:0.11.0 has a known issue with Maven 3.10+
      # where extra staging metadata can be bundled, and Central then rejects it
      - name: Set up Maven 3.9.x
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-linux-aarch64
          path: ./frida-java-core/native/

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-linux-x86_64
          path: ./frida-java-core/native/

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-macos-universal
          path: ./frida-java-core/native/

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-windows-aarch64
          path: ./frida-java-core/native/

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-windows-x86_64
          path: ./frida-java-core/native/

      - name: Verify native artifacts
        run: ls -l ./frida-java-core/native/

      - name: Build release artifacts
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f ./frida-java-core/pom.xml \
            -Prelease \
            -DskipTests \
            -Dgpg.skip=true \
            clean package

      - name: Verify sources and Javadoc artifacts exist
        run: |
          set -euo pipefail
          ls -l ./frida-java-core/target/
          SOURCES_COUNT=$(find ./frida-java-core/target -maxdepth 1 -type f -name 'frida-java-*-sources.jar' | wc -l | tr -d ' ')
          JAVADOC_COUNT=$(find ./frida-java-core/target -maxdepth 1 -type f -name 'frida-java-*-javadoc.jar' | wc -l | tr -d ' ')
          if [ "${SOURCES_COUNT}" -lt 1 ]; then
            echo "Missing sources JAR: frida-java-*-sources.jar"
            exit 1
          fi
          if [ "${JAVADOC_COUNT}" -lt 1 ]; then
            echo "Missing Javadoc JAR: frida-java-*-javadoc.jar"
            exit 1
          fi

      - name: Publish frida-java-core to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f ./frida-java-core/pom.xml \
            -Prelease \
            -DskipTests \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            deploy

      - name: Upload release JAR assets for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: github-release-jars
          path: |
            ./frida-java-core/target/frida-java-*.jar

  github-release:
    needs:
      - publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release JAR assets
        uses: actions/download-artifact@v7
        with:
          name: github-release-jars
          path: ./release-assets/

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./release-assets/*.jar
