name: Release to Maven Central

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-frida-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux so
        run: ./frida-java-core/scripts/build-frida-linux.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-linux-aarch64
          path: ./frida-java-core/frida-devkit/libfrida-core-arm64.so

  build-frida-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux so
        run: ./frida-java-core/scripts/build-frida-linux.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-linux-x86_64
          path: ./frida-java-core/frida-devkit/libfrida-core-x86_64.so

  build-frida-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build universal macOS dylib
        run: ./frida-java-core/scripts/build-frida-macos.sh

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-macos-universal
          path: ./frida-java-core/frida-devkit/libfrida-core.dylib

  build-frida-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build windows dll
        shell: powershell
        run: ./frida-java-core/scripts/build-frida-windows.ps1

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-windows-aarch64
          path: ./frida-java-core/frida-devkit/libfrida-core-arm64.dll

  build-frida-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build windows dll
        shell: powershell
        run: ./frida-java-core/scripts/build-frida-windows.ps1

      - name: Upload raw native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-raw-windows-x86_64
          path: ./frida-java-core/frida-devkit/libfrida-core-x86_64.dll

  publish:
    environment:
      name: release
    needs:
      - build-frida-linux-arm64
      - build-frida-linux-x64
      - build-frida-macos
      - build-frida-windows-arm64
      - build-frida-windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK with Maven Central and GPG
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-linux-aarch64
          path: ./frida-java-core/native/

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-linux-x86_64
          path: ./frida-java-core/native/

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-macos-universal
          path: ./frida-java-core/native/

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-windows-aarch64
          path: ./frida-java-core/native/

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: native-raw-windows-x86_64
          path: ./frida-java-core/native/

      - name: Verify native artifacts
        run: ls -l ./frida-java-core/native/

      - name: Publish frida-java-core to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f ./frida-java-core/pom.xml \
            -Prelease \
            -DskipTests \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            clean deploy
